name: Build Android AAB

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Install web dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v2
        with:
          api-level: 36
          target: google_apis
          build-tools: '36.0.0'
          cache: 'gradle'

      - name: Make Gradle wrapper executable
        run: chmod +x android-twa/gradlew

      - name: Verify assetlinks fingerprint
        working-directory: android-twa
        run: |
          set -e
          FINGERPRINT=$(keytool -list -v -keystore upload.keystore -storepass android -alias upload | awk '/SHA256/{print $2; exit}')
          echo "Keystore SHA256 fingerprint: $FINGERPRINT"
          if ! grep -q "$FINGERPRINT" ../public/.well-known/assetlinks.json; then
            echo "WARNING: fingerprint not found in public/.well-known/assetlinks.json"
          fi

      - name: Build Android release bundle
        working-directory: android-twa
        run: ./gradlew clean bundleRelease --no-daemon

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: Weekly-Dairy-Android-AAB
          path: android-twa/app/build/outputs/bundle/release/app-release.aab
